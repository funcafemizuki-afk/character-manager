name: Execute Scheduled Posts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  execute-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Scheduled Posts
        run: |
          curl -X POST "${{ secrets.VERCEL_APP_URL }}/api/cron/execute-scheduled-posts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
